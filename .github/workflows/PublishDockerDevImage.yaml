name: Publish Docker dev image

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  docker-publish:
    name: "Publish Docker image"
    if: github.repository == 'openzim/zimit'
    uses: openzim/overview/.github/workflows/docker-publish.yaml@main
    with:
      image-name: openzim/zimit
      manual-tag: dev
      latest-on-tag: false
      platforms: linux/amd64 linux/arm64
    secrets:
      ghcr_username: ${{ secrets.GHCR_USERNAME }}
      ghcr_token: ${{ secrets.GHCR_TOKEN }}

  docker-start:
    runs-on: ${{ matrix.os }}
    name: "Start Docker image on ${{ matrix.os }}"
    needs: docker-publish
    strategy:
      matrix:
        os:
          [
            ubuntu-24.04,
            ubuntu-24.04-arm,
          ]

    steps:
      - name: Ensure we can start the Docker image
        run: |
          docker run --rm ghcr.io/openzim/zimit:dev zimit --version
